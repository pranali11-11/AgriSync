version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: agrisync_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrisync_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agrisync_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrisync} -d ${POSTGRES_DB:-agrisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrisync_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrisync_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agrisync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agrisync_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-agrisync_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-agrisync}:${POSTGRES_PASSWORD:-agrisync_secure_pass}@db:5432/${POSTGRES_DB:-agrisync_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-agrisync_super_secret_jwt_key_change_in_production_12345}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrisync_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
